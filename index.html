<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="道の駅検索">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>道の駅検索</title>
  <style>
    :root{--bg:#f3f7f6;--card:#fff;--text:#10201e;--muted:#667773;--brand:#0f766e;--brand2:#115e59;--border:#d9e4e1}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    header{padding:calc(18px + env(safe-area-inset-top)) 18px 16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:white}
    header h1{margin:0;font-size:24px}
    header p{margin:6px 0 0;opacity:.9;font-size:14px}
    main{max-width:760px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
    .status,.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
    .status strong{display:block;margin-bottom:6px}
    .muted{color:var(--muted);font-size:14px}
    button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:13px;padding:12px 14px;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
    button.primary,.btn.primary{background:var(--brand);color:white}
    button.secondary,.btn.secondary{background:#e7f3f1;color:var(--brand2)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .station h2{font-size:19px;margin:0 0 4px}
    .distance{font-size:28px;font-weight:800;color:var(--brand);margin:8px 0 2px}
    .badge{display:inline-block;background:#e7f3f1;color:var(--brand2);padding:5px 9px;border-radius:999px;font-size:13px;font-weight:700}
    .empty{text-align:center;padding:28px 16px}
    .big{font-size:42px;margin-bottom:8px}
    .small{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
    select{font-size:16px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:white}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  </style>
</head>
<body>
<header>
  <h1>🚉 道の駅検索</h1>
  <p>現在地から近い「道の駅」を探します</p>
</header>
<main>
  <section class="status" id="status">
    <strong>現在地を確認しています…</strong>
    <div class="muted">この版は検索サーバーを使わず、アプリ内データから判定します。</div>
  </section>

  <section class="card">
    <div class="row">
      <div>
        <strong>検索範囲</strong>
        <div class="muted">初期設定は10km以内です</div>
      </div>
      <select id="radius">
        <option value="5">5km</option>
        <option value="10" selected>10km</option>
        <option value="20">20km</option>
        <option value="50">50km</option>
      </select>
    </div>
    <div class="actions">
      <button class="primary" id="locate">📍 現在地から検索</button>
    </div>
  </section>

  <div id="results" aria-live="polite"></div>

  <p class="small">
    この修正版は外部検索APIを使わないため、通信障害の影響を受けにくい方式です。
    現在は朝霧高原周辺の確認用データを内蔵しています。動作確認後、全国の道の駅データへ拡張できます。
  </p>
</main>

<script>
const STATIONS = [{"name": "道の駅 朝霧高原", "lat": 35.4138, "lon": 138.5889, "website": "https://www.asagiri-kogen.com/"}, {"name": "道の駅 なるさわ", "lat": 35.4777, "lon": 138.7058, "website": "https://www.ja-narusawamura.or.jp/michinoeki/"}, {"name": "道の駅 富士吉田", "lat": 35.462, "lon": 138.8038, "website": "https://fujiyoshida.net/spot/11"}];
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const radiusEl = document.getElementById('radius');
const locateBtn = document.getElementById('locate');

function setStatus(title, detail='') {
  statusEl.innerHTML = `<strong>${title}</strong><div class="muted">${detail}</div>`;
}

function haversine(lat1, lon1, lat2, lon2) {
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function render(stations, radiusKm) {
  if(!stations.length) {
    resultsEl.innerHTML = `<section class="card empty"><div class="big">🔎</div><h2>${radiusKm}km以内に登録済みの道の駅が見つかりませんでした</h2><div class="muted">検索範囲を広げるか、全国版データへの拡張後に再検索してください。</div></section>`;
    return;
  }

  resultsEl.innerHTML = stations.map((s,i)=>{
    const map = `https://maps.apple.com/?ll=${s.lat},${s.lon}&q=${encodeURIComponent(s.name)}`;
    const nav = `https://maps.apple.com/?daddr=${s.lat},${s.lon}&dirflg=d`;
    const googleSearch = 'https://www.google.com/search?q=' + encodeURIComponent(`${s.name} 公式`);
    const home = s.website || googleSearch;

    return `<section class="card station">
      <span class="badge">${i===0?'いちばん近い':'近くの道の駅'}</span>
      <div class="distance">${s.distance.toFixed(1)} km</div>
      <h2>${s.name}</h2>
      <div class="muted">現在地から直線距離</div>
      <div class="actions">
        <a class="btn primary" href="${home}" target="_blank" rel="noopener">🌐 ホームページ</a>
        <a class="btn secondary" href="${map}" target="_blank" rel="noopener">🗺 地図</a>
        <a class="btn secondary" href="${nav}" target="_blank" rel="noopener">🚗 経路案内</a>
      </div>
    </section>`;
  }).join('');
}

function locateAndSearch() {
  if(!navigator.geolocation) {
    setStatus('位置情報を利用できません','このブラウザは位置情報に対応していません。');
    return;
  }
  const radiusKm = Number(radiusEl.value);
  resultsEl.innerHTML = '';
  setStatus('現在地を取得しています…','GPSの現在地を確認しています。');

  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat, longitude:lon, accuracy} = pos.coords;
    const stations = STATIONS
      .map(s => ({...s, distance:haversine(lat,lon,s.lat,s.lon)}))
      .filter(s => s.distance <= radiusKm)
      .sort((a,b)=>a.distance-b.distance);

    setStatus(`${radiusKm}km以内に ${stations.length} 件見つかりました`,`精度の目安：約${Math.round(accuracy)}m。アプリ内データから検索しました。`);
    render(stations, radiusKm);
  }, err=>{
    const msg = err.code===1 ? '位置情報が許可されていません。Safariの位置情報を許可してください。'
      : '現在地を取得できませんでした。GPSや通信状態を確認してください。';
    setStatus('現在地を取得できません',msg);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}

locateBtn.addEventListener('click', locateAndSearch);
radiusEl.addEventListener('change', locateAndSearch);
window.addEventListener('load', locateAndSearch);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=3').catch(()=>{}));
}
</script>
</body>
</html>
